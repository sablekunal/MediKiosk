name: medikiosk
description: A rural healthcare clinical intake terminal.
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  dio: ^5.4.3+1
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/images/
